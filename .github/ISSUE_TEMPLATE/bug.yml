name: Bug report
description: A script fails or a skill gives a wrong result
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: dither, palette, print-preflight…
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and input
      description: The exact command, and the input file if you can share it (or a small one that reproduces the problem).
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Claude Code on macOS / Claude app / Python 3.12…
