name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag e.g. v0.1.0 → Publish).
# This workflow then builds one .zip per skill and attaches them, ready for
# Claude's "Upload a skill".
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python scripts/package.py
      - name: Attach skill zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
